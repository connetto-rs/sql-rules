[package]
name = "sqlippy"
version = "0.1.0"
edition = "2024"
authors = ["Earth Metabolome Initiative"]
license = "MIT"
repository = "https://github.com/connetto-rs/SQLippy"
description = "Higher-level rules and validation for SQL schemas based on sql-traits"
readme = "README.md"
keywords = ["sql", "schema", "validation", "rules", "linter"]
categories = ["database", "development-tools"]

[dependencies]
sql-traits = { git = "https://github.com/connetto-rs/sql-traits", branch = "main" }
inflection-rs = {git = "https://github.com/LucaCappelletti94/inflection-rs", branch = "main"}
thiserror = "2.0"
heck = "0.5"
sqlparser = { git = "https://github.com/apache/datafusion-sqlparser-rs", branch = "main", features = ["visitor"] }

[dev-dependencies]
diesel = { git = "https://github.com/diesel-rs/diesel", branch = "main", features = ["postgres"] }
pg_diesel = { git = "https://github.com/connetto-rs/pg_diesel", branch = "main" }
testcontainers = { version = "0.28", features = ["blocking"] }

# sql-traits and pg_diesel patch these to main only in their own workspaces.
[patch.crates-io]
diesel = { git = "https://github.com/diesel-rs/diesel", branch = "main" }
sqlparser = { git = "https://github.com/apache/datafusion-sqlparser-rs", branch = "main" }

[lints.rust]
missing_docs = "forbid"
unused_macro_rules = "forbid"
unconditional_recursion = "forbid"
unreachable_patterns = "forbid"
unused_import_braces = "forbid"
unused_must_use = "forbid"
deprecated = "deny"

[lints.rustdoc]
broken_intra_doc_links = "forbid"
bare_urls = "forbid"
invalid_codeblock_attributes = "forbid"
invalid_html_tags = "forbid"
missing_crate_level_docs = "forbid"
unescaped_backticks = "forbid"
redundant_explicit_links = "forbid"
invalid_rust_codeblocks = "forbid"

[lints.clippy]
clone_on_copy = "forbid"
pedantic = { level = "deny", priority = -1 }
